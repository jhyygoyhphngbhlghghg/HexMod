plugins {
    id "java"
    id "maven-publish"
    id "at.petra-k.pkpcpbp.PKSubprojPlugin"
    id "net.neoforged.moddev" version "2.0.140"
}

pkSubproj {
    pkPublish = true
    curseforgeJar = jar.archiveFile
    curseforgeDependencies([
        "paucal",
        "patchouli",
        "caelus",
    ])
    modrinthJar = jar.archiveFile
    modrinthDependencies([
        "paucal:HyBiJPtT",
        "patchouli:1.21.1-92-neoforge",
        "caelus:3.1.0+1.20",
    ])
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { name = "JEI"; url = "https://maven.blamejared.com" }
    flatDir { dir 'libs' }
    maven { name = "Progwml6 maven"; url = "https://dvs1.progwml6.com/files/maven/" }
    maven { name = "ModMaven"; url = "https://modmaven.dev" }
    maven { url = "https://maven.theillusivec4.top" }
    maven { url = "https://jitpack.io" }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.modrinth.one' }
}

dependencies {
    compileOnly project(":Common")
    implementation "thedarkcolour:kotlinforforge-neoforge:$kotlinForForgeVersion"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly "at.petrak:paucal-neoforge-${minecraftVersion}:${paucalVersion}"
    runtimeOnly "at.petrak:paucal-neoforge-${minecraftVersion}:${paucalVersion}"
    compileOnly files('libs/Patchouli-1.21.1-92-NEOFORGE.jar')
    runtimeOnly files('libs/Patchouli-1.21.1-92-NEOFORGE.jar')
    compileOnly files('libs/caelus-neoforge-7.0.1+1.21.1.jar')
    runtimeOnly files('libs/caelus-neoforge-7.0.1+1.21.1.jar')

    compileOnly "top.theillusivec4.curios:curios-neoforge:9.4.0+1.21.1"
    // runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.4.0+1.21.1"

    compileOnly "mezz.jei:jei-${minecraftVersion}-neoforge-api:${jeiVersion}"
    runtimeOnly "mezz.jei:jei-${minecraftVersion}-neoforge:${jeiVersion}"

    // compileOnly "maven.modrinth:inline:${minecraftVersion}-${inlineVersion}-neoforge"

    testCompileOnly "at.petrak:paucal-neoforge-${minecraftVersion}:${paucalVersion}"
    testCompileOnly "vazkii.patchouli:Patchouli:${minecraftVersion}-${patchouliVersion}-NEOFORGE-SNAPSHOT"
}

def commonMain = project(":Common").sourceSets.main
def commonProcessResources = project(":Common").tasks.named('processResources')

// Minecraft 1.21.1 datapack registry paths are singular (recipe, advancement, loot_table, tags/item, ...).
// Our sources are still mostly on legacy plural paths from older versions.
def remapDatapackPathFor1211 = { String path ->
    if (!path.startsWith('data/')) {
        return path
    }
    return path
        .replace('/recipes/', '/recipe/')
        .replace('/advancements/', '/advancement/')
        .replace('/loot_tables/', '/loot_table/')
        .replace('/item_modifiers/', '/item_modifier/')
        .replace('/tags/blocks/', '/tags/block/')
        .replace('/tags/items/', '/tags/item/')
        .replace('/tags/entity_types/', '/tags/entity_type/')
        .replace('/tags/fluids/', '/tags/fluid/')
        .replace('/tags/game_events/', '/tags/game_event/')
}

// Copy Forge-generated data (recipes, etc.) into Common's generated resources so the mod's
// Common output (on the dev run classpath) contains them and the game loads the recipes.
tasks.register('copyForgeDataToCommon', Copy) {
    from file('src/generated/resources/data')
    into project(":Common").file('src/generated/resources/data')
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
project(":Common").tasks.named('processResources').configure { dependsOn tasks.named('copyForgeDataToCommon') }
// Forge processResources reads Common's generated resources (source dir), so it must run after the copy.
tasks.named('processResources').configure { dependsOn tasks.named('copyForgeDataToCommon') }

// Ensure dev run sees recipes/loot tables: copy all mod resources into build/resources/main
// (NeoForge ModDev run uses this dir; processResources may output elsewhere.)
tasks.register('copyModResourcesForRun', Copy) {
    from file('src/main/resources')
    from file('src/generated/resources')
    from project(":Common").file('src/main/resources')
    from project(":Common").file('src/generated/resources')
    into layout.buildDirectory.dir('resources/main')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    includeEmptyDirs = false
    // Keep mod resources in the shared NeoForge mod data pack. A root pack.mcmeta can
    // cause this module's data to be treated as a separate/incompatible data pack.
    exclude 'pack.mcmeta'
    eachFile { details ->
        details.path = remapDatapackPathFor1211(details.path)
    }
    doFirst {
        delete layout.buildDirectory.file('resources/main/pack.mcmeta')
    }
}
tasks.named('copyModResourcesForRun').configure {
    dependsOn tasks.named('copyForgeDataToCommon')
    mustRunAfter tasks.named('processResources')
}

// NeoForge dev run loads the mod from build/classes/java/main only, so that root has no data/.
// Copy resources into the classes output so the single mod root has both code and recipes/assets.
// Use Copy (not Sync) so we don't remove the compiled .class files.
tasks.register('syncResourcesIntoClasses', Copy) {
    from layout.buildDirectory.dir('resources/main')
    into layout.buildDirectory.dir('classes/java/main')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    includeEmptyDirs = false
    doFirst {
        delete layout.buildDirectory.file('classes/java/main/pack.mcmeta')
    }
}
tasks.named('syncResourcesIntoClasses').configure {
    dependsOn tasks.named('processResources')
    dependsOn tasks.named('copyModResourcesForRun')
}
tasks.named('compileJava').configure { finalizedBy tasks.named('syncResourcesIntoClasses') }
tasks.named('compileKotlin').configure { finalizedBy tasks.named('syncResourcesIntoClasses') }

neoForge {
    version = project.neoforgeVersion
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', modID
            taskBefore tasks.named('copyForgeDataToCommon')
            taskBefore commonProcessResources
            taskBefore tasks.named('copyModResourcesForRun')
            taskBefore tasks.named('syncResourcesIntoClasses')
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', modID
            taskBefore tasks.named('copyForgeDataToCommon')
            taskBefore commonProcessResources
            taskBefore tasks.named('copyModResourcesForRun')
            taskBefore tasks.named('syncResourcesIntoClasses')
        }
        data {
            data()
            programArguments.addAll '--mod', modID, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        xplatDatagen {
            data()
            programArguments.addAll '--mod', modID, '--all', '--output', file('../Common/src/generated/resources/').getAbsolutePath(), '--existing', file('../Common/src/main/resources/').getAbsolutePath()
            systemProperty 'hexcasting.xplat_datagen', 'true'
        }
        forgeDatagen {
            data()
            programArguments.addAll '--mod', modID, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            systemProperty 'hexcasting.forge_datagen', 'true'
            taskBefore tasks.named('copyForgeDataToCommon')
            taskBefore commonProcessResources
            taskBefore tasks.named('copyModResourcesForRun')
            taskBefore tasks.named('syncResourcesIntoClasses')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${modID}" {
            sourceSet sourceSets.main
            sourceSet commonMain
        }
    }
}

// Run tasks use build/classes and build/resources; declare dependency so Gradle validates order.
tasks.named('runForgeDatagen').configure { dependsOn tasks.named('syncResourcesIntoClasses') }
// Explicitly copy staff (and all) recipe data into the mod root so runClient always sees them.
tasks.register('copyRecipesIntoModRoot', Copy) {
    from file('src/main/resources/data/hexcasting/recipes')
    into layout.buildDirectory.dir('classes/java/main/data/hexcasting/recipe')
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
// Recipe-pack JAR deployed to run/mods so the game always loads staff (and all) recipes.
// Fixes "Missing crafting recipe hexcasting:staff/oak" when dev classpath misses them.
def recipePackDir = layout.buildDirectory.dir('recipePack')
def recipePackMetaDir = layout.buildDirectory.dir('recipePackMeta')
tasks.register('prepareRecipePack', Copy) {
    from(file('src/main/resources/data/hexcasting/recipes')) { into 'data/hexcasting/recipe' }
    into recipePackDir
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
tasks.register('writeRecipePackModsToml') {
    outputs.dir(layout.buildDirectory.dir('recipePackMeta'))
    doLast {
        def dir = layout.buildDirectory.dir('recipePackMeta').get().file('META-INF').asFile
        dir.mkdirs()
        new File(dir, 'neoforge.mods.toml').text = """modLoader = "javafml"
loaderVersion = "[4,)"

[[mods]]
modId = "hexcasting_dev_recipes"
version = "1.0"
displayName = "Hex Casting Dev Recipes"
description = "Ensures recipes load in dev."

[[dependencies.hexcasting_dev_recipes]]
modId = "neoforge"
mandatory = true
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.hexcasting_dev_recipes]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
"""
    }
}
tasks.register('createRecipePackMod', Zip) {
    archiveFileName = 'hexcasting-dev-recipes.jar'
    destinationDirectory = file('run/mods')
    from(recipePackDir)
    from(layout.buildDirectory.dir('recipePackMeta'))
    dependsOn tasks.named('prepareRecipePack'), tasks.named('writeRecipePackModsToml')
}
tasks.named('runClient').configure {
    dependsOn tasks.named('syncResourcesIntoClasses')
    dependsOn project(":Common").tasks.named('processResources')
    dependsOn tasks.named('copyRecipesIntoModRoot')
    dependsOn tasks.named('createRecipePackMod')
}
tasks.named('copyRecipesIntoModRoot').configure { mustRunAfter tasks.named('syncResourcesIntoClasses') }

// Ensure the built JAR contains recipes (and all mod data) for regular game and server use.
// ModDev may pack from source sets or outputs that omit merged resources; explicitly add
// the merged resource dir so the published JAR always has data/hexcasting/recipes etc.
// Exclude pack.mcmeta so NeoForge treats this mod as part of the grouped "Mod Data" pack;
// an explicit pack.mcmeta can make the mod a separate data pack and break recipe loading.
tasks.named('jar').configure {
    dependsOn tasks.named('syncResourcesIntoClasses')
    dependsOn tasks.named('copyModResourcesForRun')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'pack.mcmeta'
}

compileJava {
    source(project(":Common").sourceSets.main.allSource)
}
compileKotlin {
    source(project(":Common").sourceSets.main.kotlin)
}
compileTestKotlin {
    source(project(":Common").sourceSets.main.kotlin)
}

sourceSets {
    main.resources.srcDirs += ['src/generated/resources', '../Common/src/generated/resources']
    main.kotlin.srcDirs += 'src/main/java'
    main.java.exclude 'at/petrak/hexcasting/forge/datagen/**'
    test.kotlin.srcDirs += 'src/main/java'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    exclude 'pack.mcmeta'
    // Explicitly include all resource dirs so generated data is in build (and dev run)
    from sourceSets.main.resources
    from project(":Common").sourceSets.main.resources
    inputs.property "version", project.version
    filesMatching("mods.toml") {
        expand "version": project.version
    }
    filesMatching("neoforge.mods.toml") {
        expand "version": project.version
    }
}
