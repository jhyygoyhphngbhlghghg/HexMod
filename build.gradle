import at.petrak.pkpcpbp.MiscUtil

buildscript {
    repositories {
        mavenCentral()
    }

    dependencies {
        classpath group: 'com.diluv.schoomp', name: 'Schoomp', version: '1.2.6'
    }
}

plugins {
    id 'java'
    id "org.jetbrains.kotlin.jvm"
    id 'idea'
    // This needs to be in the root
    // https://github.com/FabricMC/fabric-loom/issues/612#issuecomment-1198444120
    // Also it looks like property lookups don't work this early
    id 'fabric-loom' version '1.6-SNAPSHOT' apply false

    id("at.petra-k.pkpcpbp.PKPlugin") version "0.2.0-pre-104"
    id("at.petra-k.pkpcpbp.PKSubprojPlugin") version "0.2.0-pre-104" apply false
    id("at.petra-k.pkpcpbp.PKJson5Plugin") version "0.2.0-pre-104" apply false
}

repositories {
    mavenCentral()
}

pkpcpbp {
    // if something goes wrong in CI, make sure we can see the logs to figure out why
    superDebugInfo = System.getenv("CI") != null
    // we set the maven coordinates manually in the subprojects block
    doProjectMetadata = false
    setupJarMetadata = true
    setupMavenMetadata = true
    javaVersion = 21
    modInfo {
        modID = project.modID
        mcVersion = project.minecraftVersion
        modVersion = project.modVersion
    }
    curseforgeInfo {
        id = 569849
        stability = "beta"
        token = System.getenv("CURSEFORGE_TOKEN")
    }
    modrinthInfo {
        id = "nTW3yKrm"
        stability = "beta"
        token = System.getenv("MODRINTH_TOKEN")
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'kotlin'
    apply plugin: 'maven-publish'
    apply plugin: 'at.petra-k.pkpcpbp.PKSubprojPlugin'
    apply plugin: 'at.petra-k.pkpcpbp.PKJson5Plugin'

    group = "at.petra-k.$modID"
    base.archivesName = "$modID-$platform-$minecraftVersion"
    version = modVersion

    def isRelease = MiscUtil.isRelease(MiscUtil.getMostRecentPush(project))
    def buildNumber = System.getenv("BUILD_NUMBER")
    if (!isRelease && buildNumber != null) {
        version += "-pre-$buildNumber"
    }

    pkSubproj {
        platform = project.platform
        artifactId = base.archivesName.get()
        versionDisplayName = "$platform-$minecraftVersion-$modVersion"
    }

    pkJson5 {
        autoProcessJson5 = true
        autoProcessJson5Flattening = true
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 21
    }

    compileKotlin {
        kotlinOptions {
            jvmTarget = "21"
        }
    }
    compileTestKotlin {
        kotlinOptions {
            jvmTarget = "21"
        }
    }

    // Disable custom module metadata (mapped deps not consumable by others)
    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }

    sourceSets.main.kotlin.srcDirs += 'src/main/java'

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    java.withSourcesJar()
    java.withJavadocJar()

    processResources {
        exclude '.cache'
    }
    sourcesJar {
        duplicatesStrategy 'exclude'
    }
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "1000"
        }
    }

    // disable most javadoc warnings
    javadoc.options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.register("runAllDatagen") {
    dependsOn ":Forge:runXplatDatagen"
    dependsOn ":Forge:runForgeDatagen"
    // dependsOn ":Fabric:runDatagen"  // Re-enable when Fabric is included
}

// Collect the built mod and all runtime dependency JARs into a folder for server/client modpack
tasks.register("collectModpack", Copy) {
    group = "distribution"
    description = "Collect Hex Casting mod JAR and all dependency JARs into modpack/ for server or client modpack"
    dependsOn ":Forge:jar"

    def forgeProject = project(":Forge")

    from(forgeProject.jar.archiveFile) {
        into "."
    }
    from(forgeProject.configurations.runtimeClasspath) {
        into "."
        include "**/*.jar"
        exclude { f ->
            def n = f.name
            def p = String.valueOf(f)
            // Skip our own mod (already copied)
            (n.startsWith("hexcasting-") && n.contains("neoforge")) ||
                p.contains("Common") ||
                // Skip game/bootstrap (Minecraft, NeoForge, LWJGL, Netty, etc.)
                n.startsWith("minecraft-") ||
                n.startsWith("neoforge-") ||
                n.contains("merged") ||
                p.contains("net.minecraft") ||
                p.contains("net.neoforged") ||
                n.startsWith("lwjgl") ||
                n.startsWith("netty-") ||
                n.startsWith("log4j-") ||
                n.startsWith("gson-") ||
                n.startsWith("guava-") ||
                n.startsWith("commons-") ||
                n.startsWith("asm") ||
                n.startsWith("fastutil-") ||
                n.startsWith("datafixerupper-") ||
                n.startsWith("icu4j-") ||
                n.startsWith("authlib-") ||
                n.startsWith("brigadier-") ||
                n.startsWith("jna-") ||
                n.startsWith("sponge-mixin") ||
                (n.startsWith("kotlin-") && !n.startsWith("kotlinforforge")) ||
                n.startsWith("kotlinx-") ||
                n.contains("slf4j") ||
                n.contains("jline-") ||
                n.startsWith("httpcore") ||
                n.startsWith("httpclient") ||
                n.startsWith("joml-") ||
                n.startsWith("core-") ||
                n.startsWith("toml-") ||
                n.startsWith("securejarhandler") ||
                n.startsWith("modlauncher") ||
                n.startsWith("bootstraplauncher") ||
                n.startsWith("blocklist") ||
                n.startsWith("antlr4-") ||
                n.startsWith("annotations-") ||
                n.startsWith("checker-qual") ||
                n.startsWith("error_prone") ||
                n.startsWith("failureaccess") ||
                n.startsWith("listenablefuture") ||
                n.startsWith("jsr305") ||
                n.startsWith("j2objc") ||
                n.startsWith("maven-artifact") ||
                n.startsWith("nashorn-") ||
                n.startsWith("noexception") ||
                n.startsWith("oshi-") ||
                n.startsWith("plexus-") ||
                n.startsWith("patchy-") ||
                n.startsWith("terminalconsoleappender") ||
                n.startsWith("text2speech") ||
                n.startsWith("typetools") ||
                n.startsWith("logging-")
        }
    }

    into "modpack"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    doLast {
        def dir = file("modpack")
        logger.lifecycle("Modpack JARs written to: ${dir.absolutePath}")
    }
}

// Build, empty mods/, and fill it with the mod + all dependencies for server use
tasks.register("installMods", Copy) {
    group = "distribution"
    description = "Build mod + deps, clear mods/, and copy everything needed for server into mods/"
    dependsOn "collectModpack"

    def modsDir = file("modpack")
    from(modsDir) {
        include "**/*.jar"
    }
    into "mods"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    doFirst {
        def target = file("mods")
        if (target.exists()) {
            target.listFiles()?.each { it.delete() }
            logger.lifecycle("Emptied mods/")
        }
        target.mkdirs()
    }
    doLast {
        logger.lifecycle("Server mods installed to: ${file('mods').absolutePath}")
    }
}
